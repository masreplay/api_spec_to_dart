name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Format, analyze, test (unit, golden, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace
        run: dart pub get --no-example

      - name: Format
        run: |
          git ls-files 'packages/swagger_to_dart/*.dart' 'packages/postman_collection/*.dart' \
            | grep -v -E '\.(g|freezed)\.dart$|/example/' \
            | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: dart analyze --fatal-infos packages/swagger_to_dart packages/postman_collection

      - name: Test swagger_to_dart
        working-directory: packages/swagger_to_dart
        run: dart test

      - name: Test postman_collection
        working-directory: packages/postman_collection
        run: dart test

  example:
    name: Example app (generate, build, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/swagger_to_dart/example
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate from the OpenAPI spec
        run: dart run swagger_to_dart

      - name: Fail if the committed generated code is stale
        run: |
          test -z "$(git status --porcelain -- lib/src/gen)" || { git status --porcelain -- lib/src/gen; git diff -- lib/src/gen | head -300; exit 1; }

      - name: Build freezed/json_serializable/retrofit outputs
        run: dart run build_runner build

      - name: Analyze
        run: dart analyze --fatal-infos lib test

      - name: Test
        run: flutter test

  pana:
    name: pub.dev score (must stay 160/160)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: dart pub global activate pana

      - name: Score swagger_to_dart the way pub.dev does
        run: |
          pkg="$RUNNER_TEMP/swagger_to_dart"
          cp -RL packages/swagger_to_dart "$pkg"
          sed -i '/^resolution: workspace$/d' "$pkg/pubspec.yaml"
          dart pub global run pana --no-warning --exit-code-threshold 0 "$pkg"
