$kind: http-example
request:
  url: '{{base_url}}/books?limit=10'
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      [
        {"id": 1, "title": "Example Book", "author": "Jane Doe", "published": "2020-01-01T00:00:00Z"}
      ]
