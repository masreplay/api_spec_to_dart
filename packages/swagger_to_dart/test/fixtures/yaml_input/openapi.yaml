# YAML-only syntax: anchors and aliases, a `<<` merge key, unquoted integer
# response codes, block scalars and flow collections.
openapi: 3.0.3
info:
  title: YAML input
  version: '1.0'
paths:
  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      description: |
        Lists notes.
        Newest first.
      responses:
        200:
          description: The notes
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Note'}
        default: &error
          description: Unexpected error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      tags: [notes]
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewNote'}
      responses:
        201:
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Note'}
        default: *error
components:
  schemas:
    NewNote: &newNote
      type: object
      required: [text]
      properties:
        text: {type: string}
        pinned: {type: boolean, default: false}
    Note:
      <<: *newNote
      required: [id, text]
      properties:
        id: {type: integer, format: int64}
        text: {type: string}
        pinned: {type: boolean, default: false}
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
