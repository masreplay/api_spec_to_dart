name: example
description: Flutter app whose API client and models are generated by swagger_to_dart from a FastAPI spec.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  retrofit: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11

  swagger_to_dart:
    path: ../

# swagger_to_dart from path needs the unreleased postman_collection 1.0.0
# beside it; drop this once 1.0.0 is on pub.dev.
dependency_overrides:
  postman_collection:
    path: ../../postman_collection

flutter:
  generate: true
