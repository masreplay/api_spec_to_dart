name: postman_collection
description: >-
  Typed Dart models for Postman collections, generated from Postman's official
  v2.1.0 schema, and a converter from every Postman format to OpenAPI.
version: 1.0.0
repository: https://github.com/masreplay/api_spec_to_dart/tree/main/packages/postman_collection
issue_tracker: https://github.com/masreplay/api_spec_to_dart/issues
topics: [postman, openapi, codegen, dart]

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_schema: ^5.2.2
  json_serializable: ^6.14.1
  lints: ^6.1.0
  test: ^1.32.0
