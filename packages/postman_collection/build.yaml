# Builds the freezed/json_serializable parts of the models swagger_to_dart
# generates into lib/src/models (`make models`).
global_options:
  freezed:
    runs_before:
      - json_serializable

targets:
  $default:
    sources:
      - lib/**
      - $package$
    builders:
      json_serializable:
        options:
          explicit_to_json: true
          include_if_null: false
      freezed:
        options:
          format: true
