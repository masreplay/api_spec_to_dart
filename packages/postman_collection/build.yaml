targets:
  $default:
    sources:
      - lib/**
      - $package$
    builders:
      json_serializable:
        options:
          create_factory: true
          create_to_json: true
          explicit_to_json: true
          include_if_null: false
      freezed:
        options:
          union_key: type
          format: true
          copy_with: true
